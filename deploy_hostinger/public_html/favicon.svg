<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente de fondo pastel Dollhouse -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FFD1DC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <!-- Gradiente dorado elegante -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <!-- Gradiente esmalte fucsia / rose -->
    <linearGradient id="polishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#BE185D" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Círculo base con borde dorado -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#shadow)" />
  
  <!-- Anillo punteado decorativo interior -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.85" />

  <!-- Tapa dorada del esmalte -->
  <rect x="45" y="23" width="10" height="18" rx="2" fill="url(#goldGrad)" />
  <rect x="43" y="39" width="14" height="3" rx="1.5" fill="#CA8A04" />

  <!-- Frasco de esmalte de uñas -->
  <path d="M36 42 C36 42, 34 46, 34 52 L34 68 C34 74, 38 77, 44 77 L56 77 C62 77, 66 74, 66 68 L66 52 C66 46, 64 42, 64 42 Z" fill="url(#polishGrad)" />

  <!-- Brillo del frasco -->
  <path d="M39 46 Q37 54 37 66" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <circle cx="50" cy="58" r="4" fill="#FFFFFF" opacity="0.25" />

  <!-- Destello grande superior derecho (estrella de brillo) -->
  <path d="M72 25 Q72 31 78 31 Q72 31 72 37 Q72 31 66 31 Q72 31 72 25 Z" fill="url(#goldGrad)" />
  <circle cx="72" cy="31" r="1.5" fill="#FFFFFF" />

  <!-- Destello pequeño izquierdo -->
  <path d="M26 35 Q26 39 30 39 Q26 39 26 43 Q26 39 22 39 Q26 39 26 35 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Puntos brillantes -->
  <circle cx="74" cy="56" r="2.2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="26" cy="62" r="1.8" fill="url(#goldGrad)" />
</svg>